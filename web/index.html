<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMSRadar RAG Chatbot</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #18212f;
        --muted: #5b6777;
        --border: #dbe2ec;
        --accent: #1f6feb;
        --accent-hover: #1a5fcc;
        --user-bubble: #dcecff;
        --bot-bubble: #e9f8e7;
      }

      [data-theme="dark"] {
        --bg: #0e1218;
        --card: #151b24;
        --text: #eaf0f8;
        --muted: #a6b2c2;
        --border: #283445;
        --accent: #4b91ff;
        --accent-hover: #3b7fe6;
        --user-bubble: #193352;
        --bot-bubble: #223f2d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Inter, Arial, sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 960px;
        margin: 24px auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        padding: 16px;
      }

      .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 20px;
        margin: 0;
      }

      .sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .theme-btn {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        cursor: pointer;
      }

      #messages {
        height: 58vh;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        background: color-mix(in srgb, var(--card) 96%, #000 4%);
      }

      .msg {
        margin: 10px 0;
        padding: 10px 12px;
        border-radius: 10px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .user {
        background: var(--user-bubble);
      }

      .bot {
        background: var(--bot-bubble);
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      input,
      button {
        padding: 11px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 15px;
      }

      input {
        flex: 1;
        background: transparent;
        color: var(--text);
      }

      input::placeholder {
        color: var(--muted);
      }

      button {
        background: var(--accent);
        color: #fff;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body data-theme="light">
    <div class="wrap">
      <div class="head">
        <div>
          <h1>SMSRadar RAG Chatbot</h1>
          <p class="sub">YHQ sualları üçün kontekst əsaslı cavab sistemi</p>
        </div>
        <button class="theme-btn" id="themeBtn" type="button">🌙 Dark mode</button>
      </div>
      <div id="messages"></div>
      <div class="row">
        <input id="prompt" placeholder="Sualınızı yazın..." />
        <button id="sendBtn">Göndər</button>
      </div>
    </div>
    <script src="/web/app.js"></script>
  </body>
</html>
